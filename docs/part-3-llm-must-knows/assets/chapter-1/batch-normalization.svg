<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Batch normalization of a 32 by 100 input</title>
  <desc id="desc">The first of 100 feature columns is highlighted across 32 examples. Its batch mean and sample variance are calculated across rows, then reused to normalize every value in that column. With gamma one and beta zero, the output keeps approximately zero mean and unit sample standard deviation.</desc>
  <style>
    .head { font: 650 22px Inter, Arial, sans-serif; fill: #263746; }
    .body { font: 600 21px Inter, Arial, sans-serif; fill: #2b3b49; }
    .small { font: 500 17px Inter, Arial, sans-serif; fill: #536574; }
    .value { font: 650 22px Inter, Arial, sans-serif; fill: #305c77; }
    .arrow { fill: none; stroke: #5d6d78; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1120" height="560" rx="20" fill="#ffffff"/>
  <rect x="15" y="15" width="1090" height="530" rx="16" fill="#fcfdf9" stroke="#e1e9dc" stroke-width="2"/>

  <rect x="35" y="75" width="300" height="400" rx="16" fill="#f5f8f2" stroke="#d5e2cf" stroke-width="2"/>
  <text class="head" x="185" y="113" text-anchor="middle">Input x</text>
  <text class="small" x="185" y="142" text-anchor="middle">32 examples × 100 features</text>
  <text class="small" x="120" y="181" text-anchor="middle">f₀</text>
  <text class="small" x="190" y="181" text-anchor="middle">⋯</text>
  <text class="small" x="260" y="181" text-anchor="middle">f₉₉</text>

  <text class="small" x="64" y="219" text-anchor="middle">1</text>
  <text class="small" x="64" y="279" text-anchor="middle">2</text>
  <text class="small" x="64" y="339" text-anchor="middle">⋮</text>
  <text class="small" x="64" y="399" text-anchor="middle">32</text>

  <rect x="91" y="190" width="55" height="44" rx="8" fill="#e3f0fb" stroke="#a8c9e7" stroke-width="2"/>
  <rect x="161" y="190" width="55" height="44" rx="8" fill="#fff" stroke="#dbe3df"/>
  <rect x="231" y="190" width="55" height="44" rx="8" fill="#fff" stroke="#dbe3df"/>
  <text class="value" x="118.5" y="219" text-anchor="middle">x₁</text>

  <rect x="91" y="250" width="55" height="44" rx="8" fill="#e3f0fb" stroke="#a8c9e7" stroke-width="2"/>
  <rect x="161" y="250" width="55" height="44" rx="8" fill="#fff" stroke="#dbe3df"/>
  <rect x="231" y="250" width="55" height="44" rx="8" fill="#fff" stroke="#dbe3df"/>
  <text class="value" x="118.5" y="279" text-anchor="middle">x₂</text>

  <rect x="91" y="310" width="55" height="44" rx="8" fill="#e3f0fb" stroke="#a8c9e7" stroke-width="2"/>
  <rect x="161" y="310" width="55" height="44" rx="8" fill="#fff" stroke="#dbe3df"/>
  <rect x="231" y="310" width="55" height="44" rx="8" fill="#fff" stroke="#dbe3df"/>
  <text class="value" x="118.5" y="339" text-anchor="middle">⋮</text>

  <rect x="91" y="370" width="55" height="44" rx="8" fill="#e3f0fb" stroke="#a8c9e7" stroke-width="2"/>
  <rect x="161" y="370" width="55" height="44" rx="8" fill="#fff" stroke="#dbe3df"/>
  <rect x="231" y="370" width="55" height="44" rx="8" fill="#fff" stroke="#dbe3df"/>
  <text class="value" x="118.5" y="399" text-anchor="middle">x₃₂</text>

  <path class="arrow" d="M347 275 H372 M365 268 L372 275 L365 282"/>

  <rect x="385" y="75" width="195" height="400" rx="16" fill="#eaf2fb" stroke="#bfd4e9" stroke-width="2"/>
  <text class="head" x="482.5" y="113" text-anchor="middle">Feature f₀</text>
  <text class="small" x="482.5" y="142" text-anchor="middle">across all 32 rows</text>
  <rect x="405" y="195" width="155" height="80" rx="12" fill="#fff" stroke="#c9dbee" stroke-width="2"/>
  <text class="small" x="482.5" y="225" text-anchor="middle">batch mean</text>
  <text class="value" x="482.5" y="255" text-anchor="middle">μ₀</text>
  <rect x="405" y="295" width="155" height="80" rx="12" fill="#fff" stroke="#c9dbee" stroke-width="2"/>
  <text class="small" x="482.5" y="325" text-anchor="middle">sample variance</text>
  <text class="value" x="482.5" y="355" text-anchor="middle">s₀²</text>

  <path class="arrow" d="M592 275 H617 M610 268 L617 275 L610 282"/>

  <rect x="630" y="75" width="200" height="400" rx="16" fill="#fff2e7" stroke="#e9ccb2" stroke-width="2"/>
  <text class="head" x="730" y="113" text-anchor="middle">Normalize</text>
  <text class="small" x="730" y="142" text-anchor="middle">(x − μ₀) / √(s₀² + ε)</text>
  <rect x="650" y="190" width="160" height="44" rx="9" fill="#fff" stroke="#ead2bf"/>
  <rect x="650" y="250" width="160" height="44" rx="9" fill="#fff" stroke="#ead2bf"/>
  <rect x="650" y="310" width="160" height="44" rx="9" fill="#fff" stroke="#ead2bf"/>
  <rect x="650" y="370" width="160" height="44" rx="9" fill="#fff" stroke="#ead2bf"/>
  <text class="body" x="730" y="219" text-anchor="middle">z₁</text>
  <text class="body" x="730" y="279" text-anchor="middle">z₂</text>
  <text class="body" x="730" y="339" text-anchor="middle">⋮</text>
  <text class="body" x="730" y="399" text-anchor="middle">z₃₂</text>

  <path class="arrow" d="M842 275 H867 M860 268 L867 275 L860 282"/>

  <rect x="880" y="75" width="205" height="400" rx="16" fill="#eff6e9" stroke="#c5dbb8" stroke-width="2"/>
  <text class="head" x="982.5" y="113" text-anchor="middle">Output y[:, 0]</text>
  <text class="small" x="982.5" y="142" text-anchor="middle">γ₀ = 1, β₀ = 0</text>
  <rect x="900" y="190" width="165" height="44" rx="9" fill="#fff" stroke="#cbdcbe"/>
  <rect x="900" y="250" width="165" height="44" rx="9" fill="#fff" stroke="#cbdcbe"/>
  <rect x="900" y="310" width="165" height="44" rx="9" fill="#fff" stroke="#cbdcbe"/>
  <rect x="900" y="370" width="165" height="44" rx="9" fill="#fff" stroke="#cbdcbe"/>
  <text class="body" x="982.5" y="219" text-anchor="middle">y₁</text>
  <text class="body" x="982.5" y="279" text-anchor="middle">y₂</text>
  <text class="body" x="982.5" y="339" text-anchor="middle">⋮</text>
  <text class="body" x="982.5" y="399" text-anchor="middle">y₃₂</text>

  <text class="small" x="560" y="516" text-anchor="middle">For this feature: mean ≈ 0 and sample standard deviation ≈ 1.</text>
</svg>
