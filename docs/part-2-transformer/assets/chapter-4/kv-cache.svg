<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Why decoding caches keys and values, not queries</title>
  <desc id="desc">At each generation step, the new token creates a query, key, and value. Its query reads all cached keys and the resulting attention weights combine all cached values. The new key and value are saved for the next step; the query is used once and discarded.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 Z" fill="#53635b"/></marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5681b8"/></marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #26332d; }
      .label { font-size: 18px; font-weight: 650; }
      .small { font-size: 15px; fill: #52615a; }
      .token { font-size: 19px; font-weight: 650; }
      .box { stroke-width: 1.5; }
      .line { fill: none; stroke: #53635b; stroke-width: 2; marker-end: url(#arrow); }
      .blue-line { fill: none; stroke: #5681b8; stroke-width: 2.2; marker-end: url(#arrow-blue); }
    </style>
  </defs>
  <rect x="12" y="12" width="1176" height="666" rx="22" fill="#fbfdf9" stroke="#dce7d7" stroke-width="2"/>

  <text x="48" y="58" font-size="25" font-weight="720">One decoding step</text>
  <text x="48" y="86" class="small">The current token reads the reusable past; only its K and V join the cache.</text>

  <!-- Existing prefix and newly generated token -->
  <text x="50" y="133" class="small">Context so far</text>
  <g class="box" stroke="#b8c9de">
    <rect x="50" y="148" width="72" height="48" rx="10" fill="#edf4fc"/><rect x="134" y="148" width="72" height="48" rx="10" fill="#edf4fc"/><rect x="218" y="148" width="72" height="48" rx="10" fill="#edf4fc"/>
  </g>
  <text x="86" y="179" text-anchor="middle" class="token">x₀</text><text x="170" y="179" text-anchor="middle" class="token">x₁</text><text x="254" y="179" text-anchor="middle" class="token">x₂</text>
  <text x="305" y="180" class="label" fill="#728078">…</text>
  <rect x="370" y="142" width="110" height="60" rx="13" fill="#fff2df" stroke="#e7bd7d" stroke-width="2"/>
  <text x="425" y="169" text-anchor="middle" class="small">new token</text><text x="425" y="191" text-anchor="middle" class="token">xₜ</text>

  <!-- Fresh projections -->
  <path d="M425 202 V232 H585" class="line"/>
  <text x="50" y="251" class="small">At this step, compute fresh qₜ, kₜ, vₜ</text>
  <rect x="585" y="215" width="90" height="48" rx="12" fill="#e8f1fb" stroke="#b8c9de" class="box"/><text x="630" y="246" text-anchor="middle" class="token">qₜ</text>
  <rect x="695" y="215" width="90" height="48" rx="12" fill="#e9f5df" stroke="#c4d9b2" class="box"/><text x="740" y="246" text-anchor="middle" class="token">kₜ</text>
  <rect x="805" y="215" width="90" height="48" rx="12" fill="#e9f5df" stroke="#c4d9b2" class="box"/><text x="850" y="246" text-anchor="middle" class="token">vₜ</text>

  <!-- Persistent cache -->
  <rect x="48" y="300" width="550" height="206" rx="18" fill="#f2f8ed" stroke="#c8dabb" stroke-width="1.5"/>
  <text x="74" y="337" class="label">Persistent cache</text>
  <text x="74" y="383" class="label" fill="#456640">K</text>
  <g class="box" stroke="#c4d9b2">
    <rect x="115" y="354" width="76" height="44" rx="9" fill="#e7f2dc"/><rect x="201" y="354" width="76" height="44" rx="9" fill="#e7f2dc"/><rect x="287" y="354" width="76" height="44" rx="9" fill="#e7f2dc"/><rect x="373" y="354" width="76" height="44" rx="9" fill="#e7f2dc"/>
  </g>
  <text x="153" y="383" text-anchor="middle" class="token">k₀</text><text x="239" y="383" text-anchor="middle" class="token">k₁</text><text x="325" y="383" text-anchor="middle" class="token">k₂</text><text x="411" y="383" text-anchor="middle" class="token">…</text>
  <text x="465" y="383" class="small">+ kₜ</text>
  <text x="74" y="453" class="label" fill="#456640">V</text>
  <g class="box" stroke="#c4d9b2">
    <rect x="115" y="424" width="76" height="44" rx="9" fill="#e7f2dc"/><rect x="201" y="424" width="76" height="44" rx="9" fill="#e7f2dc"/><rect x="287" y="424" width="76" height="44" rx="9" fill="#e7f2dc"/><rect x="373" y="424" width="76" height="44" rx="9" fill="#e7f2dc"/>
  </g>
  <text x="153" y="453" text-anchor="middle" class="token">v₀</text><text x="239" y="453" text-anchor="middle" class="token">v₁</text><text x="325" y="453" text-anchor="middle" class="token">v₂</text><text x="411" y="453" text-anchor="middle" class="token">…</text>
  <text x="465" y="453" class="small">+ vₜ</text>
  <text x="74" y="488" class="small">Past K/V are reused; append the new K/V for the next step.</text>

  <!-- Attention operation -->
  <rect x="650" y="321" width="190" height="82" rx="15" fill="#edf4fc" stroke="#b8c9de" stroke-width="1.5"/>
  <text x="745" y="355" text-anchor="middle" class="label">qₜ scores</text><text x="745" y="380" text-anchor="middle" class="small">cached K</text>
  <path d="M675 263 V288 H745 V314" class="blue-line"/>
  <path d="M598 376 H642" class="line"/>
  <rect x="885" y="321" width="130" height="82" rx="15" fill="#fff2df" stroke="#e7bd7d" stroke-width="1.5"/>
  <text x="950" y="355" text-anchor="middle" class="label">weights</text><text x="950" y="380" text-anchor="middle" class="small">Softmax</text>
  <path d="M840 362 H877" class="line"/>
  <rect x="1050" y="321" width="110" height="82" rx="15" fill="#e9f5df" stroke="#c4d9b2" stroke-width="1.5"/>
  <text x="1105" y="355" text-anchor="middle" class="label">hₜ</text><text x="1105" y="380" text-anchor="middle" class="small">output</text>
  <path d="M1015 362 H1042" class="line"/>
  <path d="M598 445 H1030 V410" class="blue-line"/>
  <text x="866" y="466" class="small">weights combine cached V</text>

  <!-- Q cache explanation -->
  <rect x="650" y="520" width="510" height="112" rx="17" fill="#f4f7fc" stroke="#d3dfef" stroke-width="1.5"/>
  <text x="678" y="555" class="label">Why no Q cache?</text>
  <text x="678" y="583" class="small">qₜ is used for this step’s output, then discarded.</text>
  <text x="678" y="608" class="small">Next step creates qₜ₊₁; it needs past K/V, not past Q.</text>
  <path d="M630 263 V548 H642" fill="none" stroke="#91a6bd" stroke-width="1.8" stroke-dasharray="6 6"/>
  <text x="525" y="565" class="small" fill="#6e7f90">not stored</text>
</svg>
