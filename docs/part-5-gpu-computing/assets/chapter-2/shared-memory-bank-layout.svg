<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">1,024 shared floats distributed across 32 banks</title>
  <desc id="desc">Logical mapping for 32 banks and 32-bit floats starting at Bank 0. Each column is one bank. Consecutive indices 0 through 31 occupy Banks 0 through 31, and the mapping repeats every 32 elements. Bank 0 contains indices 0, 32, 64, 96, through 992. Bank 31 contains 31, 63, 95, 127, through 1023. Each bank holds 32 elements of this array. Ellipses omit Banks 3 through 29 and rows 4 through 30. Highlighted Bank 0 contains all words read by shared_data[thread_id * 32].</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243028; }
      .label { font-size: 25px; font-weight: 680; }
      .index { font-size: 28px; font-weight: 600; }
      .ellipsis { font-size: 30px; fill: #586c5d; }
      .math { font-family: Georgia, "Times New Roman", serif; font-size: 26px; }
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="688" rx="22" fill="#fbfdf8" stroke="#dbe3df"/>
  <text class="label" x="48" y="66">shared_data[1024]</text>
  <text class="label" x="1152" y="66" text-anchor="end">32 banks × 32 floats</text>
  <!-- Selected bank and neighboring banks. Repeated columns and rows are omitted. -->
  <g>
    <rect x="48" y="105" width="176" height="506" rx="16" fill="#fff4e3" stroke="#c78331" stroke-width="3"/>
    <text class="label" x="136" y="151" text-anchor="middle">Bank 0</text>
    <rect x="72" y="179" width="128" height="56" rx="8" fill="#ffffff" stroke="#c78331" stroke-width="1.5"/>
    <text class="index" x="136" y="217" text-anchor="middle">0</text>
    <rect x="72" y="259" width="128" height="56" rx="8" fill="#ffffff" stroke="#c78331" stroke-width="1.5"/>
    <text class="index" x="136" y="297" text-anchor="middle">32</text>
    <rect x="72" y="339" width="128" height="56" rx="8" fill="#ffffff" stroke="#c78331" stroke-width="1.5"/>
    <text class="index" x="136" y="377" text-anchor="middle">64</text>
    <rect x="72" y="419" width="128" height="56" rx="8" fill="#ffffff" stroke="#c78331" stroke-width="1.5"/>
    <text class="index" x="136" y="457" text-anchor="middle">96</text>
    <rect x="72" y="540" width="128" height="56" rx="8" fill="#ffffff" stroke="#c78331" stroke-width="1.5"/>
    <text class="index" x="136" y="578" text-anchor="middle">992</text>
    <text class="ellipsis" x="136" y="518" text-anchor="middle">⋮</text>
  </g>
  <g>
    <rect x="248" y="105" width="176" height="506" rx="16" fill="#f6f9fb" stroke="#d1dfeb" stroke-width="1.5"/>
    <text class="label" x="336" y="151" text-anchor="middle">Bank 1</text>
    <rect x="272" y="179" width="128" height="56" rx="8" fill="#ffffff" stroke="#d1dfeb" stroke-width="1.5"/>
    <text class="index" x="336" y="217" text-anchor="middle">1</text>
    <rect x="272" y="259" width="128" height="56" rx="8" fill="#ffffff" stroke="#d1dfeb" stroke-width="1.5"/>
    <text class="index" x="336" y="297" text-anchor="middle">33</text>
    <rect x="272" y="339" width="128" height="56" rx="8" fill="#ffffff" stroke="#d1dfeb" stroke-width="1.5"/>
    <text class="index" x="336" y="377" text-anchor="middle">65</text>
    <rect x="272" y="419" width="128" height="56" rx="8" fill="#ffffff" stroke="#d1dfeb" stroke-width="1.5"/>
    <text class="index" x="336" y="457" text-anchor="middle">97</text>
    <rect x="272" y="540" width="128" height="56" rx="8" fill="#ffffff" stroke="#d1dfeb" stroke-width="1.5"/>
    <text class="index" x="336" y="578" text-anchor="middle">993</text>
    <text class="ellipsis" x="336" y="518" text-anchor="middle">⋮</text>
  </g>
  <g>
    <rect x="448" y="105" width="176" height="506" rx="16" fill="#f6f9fb" stroke="#d1dfeb" stroke-width="1.5"/>
    <text class="label" x="536" y="151" text-anchor="middle">Bank 2</text>
    <rect x="472" y="179" width="128" height="56" rx="8" fill="#ffffff" stroke="#d1dfeb" stroke-width="1.5"/>
    <text class="index" x="536" y="217" text-anchor="middle">2</text>
    <rect x="472" y="259" width="128" height="56" rx="8" fill="#ffffff" stroke="#d1dfeb" stroke-width="1.5"/>
    <text class="index" x="536" y="297" text-anchor="middle">34</text>
    <rect x="472" y="339" width="128" height="56" rx="8" fill="#ffffff" stroke="#d1dfeb" stroke-width="1.5"/>
    <text class="index" x="536" y="377" text-anchor="middle">66</text>
    <rect x="472" y="419" width="128" height="56" rx="8" fill="#ffffff" stroke="#d1dfeb" stroke-width="1.5"/>
    <text class="index" x="536" y="457" text-anchor="middle">98</text>
    <rect x="472" y="540" width="128" height="56" rx="8" fill="#ffffff" stroke="#d1dfeb" stroke-width="1.5"/>
    <text class="index" x="536" y="578" text-anchor="middle">994</text>
    <text class="ellipsis" x="536" y="518" text-anchor="middle">⋮</text>
  </g>
  <g>
    <rect x="776" y="105" width="176" height="506" rx="16" fill="#f6f9fb" stroke="#d1dfeb" stroke-width="1.5"/>
    <text class="label" x="864" y="151" text-anchor="middle">Bank 30</text>
    <rect x="800" y="179" width="128" height="56" rx="8" fill="#ffffff" stroke="#d1dfeb" stroke-width="1.5"/>
    <text class="index" x="864" y="217" text-anchor="middle">30</text>
    <rect x="800" y="259" width="128" height="56" rx="8" fill="#ffffff" stroke="#d1dfeb" stroke-width="1.5"/>
    <text class="index" x="864" y="297" text-anchor="middle">62</text>
    <rect x="800" y="339" width="128" height="56" rx="8" fill="#ffffff" stroke="#d1dfeb" stroke-width="1.5"/>
    <text class="index" x="864" y="377" text-anchor="middle">94</text>
    <rect x="800" y="419" width="128" height="56" rx="8" fill="#ffffff" stroke="#d1dfeb" stroke-width="1.5"/>
    <text class="index" x="864" y="457" text-anchor="middle">126</text>
    <rect x="800" y="540" width="128" height="56" rx="8" fill="#ffffff" stroke="#d1dfeb" stroke-width="1.5"/>
    <text class="index" x="864" y="578" text-anchor="middle">1022</text>
    <text class="ellipsis" x="864" y="518" text-anchor="middle">⋮</text>
  </g>
  <g>
    <rect x="976" y="105" width="176" height="506" rx="16" fill="#f6f9fb" stroke="#d1dfeb" stroke-width="1.5"/>
    <text class="label" x="1064" y="151" text-anchor="middle">Bank 31</text>
    <rect x="1000" y="179" width="128" height="56" rx="8" fill="#ffffff" stroke="#d1dfeb" stroke-width="1.5"/>
    <text class="index" x="1064" y="217" text-anchor="middle">31</text>
    <rect x="1000" y="259" width="128" height="56" rx="8" fill="#ffffff" stroke="#d1dfeb" stroke-width="1.5"/>
    <text class="index" x="1064" y="297" text-anchor="middle">63</text>
    <rect x="1000" y="339" width="128" height="56" rx="8" fill="#ffffff" stroke="#d1dfeb" stroke-width="1.5"/>
    <text class="index" x="1064" y="377" text-anchor="middle">95</text>
    <rect x="1000" y="419" width="128" height="56" rx="8" fill="#ffffff" stroke="#d1dfeb" stroke-width="1.5"/>
    <text class="index" x="1064" y="457" text-anchor="middle">127</text>
    <rect x="1000" y="540" width="128" height="56" rx="8" fill="#ffffff" stroke="#d1dfeb" stroke-width="1.5"/>
    <text class="index" x="1064" y="578" text-anchor="middle">1023</text>
    <text class="ellipsis" x="1064" y="518" text-anchor="middle">⋮</text>
  </g>
  <text class="ellipsis" x="700" y="151" text-anchor="middle">…</text>
  <text class="ellipsis" x="700" y="217" text-anchor="middle">…</text>
  <text class="ellipsis" x="700" y="297" text-anchor="middle">…</text>
  <text class="ellipsis" x="700" y="377" text-anchor="middle">…</text>
  <text class="ellipsis" x="700" y="457" text-anchor="middle">…</text>
  <text class="ellipsis" x="700" y="578" text-anchor="middle">…</text>
  <text class="math" x="600" y="655" text-anchor="middle">bank = index % 32</text>
</svg>
