<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
<title id="title">Workgroups assigned to SMs</title><desc id="desc">Six logical workgroups in a three by two dispatch grid are assigned to three SMs. In this possible placement, each SM receives two complete workgroups. Placement is illustrative and is not selected by grid coordinates.</desc>
<defs>
<marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,7 L7,3.5 z" fill="#516559"/></marker>
<style>
text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243028; }
.section { font-size: 24px; font-weight: 700; }
.label { font-size: 21px; font-weight: 680; }
.small { font-size: 19px; fill: #586c5d; }
.math { font-family: Georgia, "Times New Roman", serif; font-size: 24px; font-weight: 650; }
.arrow { fill: none; stroke: #516559; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
</style></defs>
<rect width="1200" height="840" rx="24" fill="#fbfdf8"/>
<!-- Logical dispatch grid -->
<rect x="48" y="48" width="1104" height="302" rx="14" fill="#f6f9fb" stroke="#d1dfeb" stroke-width="1.8"/>
<text x="80" y="91" class="section" text-anchor="start">Dispatch: 3 × 2 workgroups</text>
<rect x="80" y="126" width="320" height="80" rx="14" fill="#fff" stroke="#d1dfeb" stroke-width="1.8"/>
<text x="240" y="174" class="label" text-anchor="middle">WG (0, 0, 0)</text>
<rect x="80" y="234" width="320" height="80" rx="14" fill="#fff" stroke="#d1dfeb" stroke-width="1.8"/>
<text x="240" y="282" class="label" text-anchor="middle">WG (0, 1, 0)</text>
<rect x="440" y="126" width="320" height="80" rx="14" fill="#fff" stroke="#d1dfeb" stroke-width="1.8"/>
<text x="600" y="174" class="label" text-anchor="middle">WG (1, 0, 0)</text>
<rect x="440" y="234" width="320" height="80" rx="14" fill="#fff" stroke="#d1dfeb" stroke-width="1.8"/>
<text x="600" y="282" class="label" text-anchor="middle">WG (1, 1, 0)</text>
<rect x="800" y="126" width="320" height="80" rx="14" fill="#fff" stroke="#d1dfeb" stroke-width="1.8"/>
<text x="960" y="174" class="label" text-anchor="middle">WG (2, 0, 0)</text>
<rect x="800" y="234" width="320" height="80" rx="14" fill="#fff" stroke="#d1dfeb" stroke-width="1.8"/>
<text x="960" y="282" class="label" text-anchor="middle">WG (2, 1, 0)</text>
<!-- Whole-workgroup assignment, with no crossing connectors -->
<path d="M240 368 V448" class="arrow"/>
<path d="M600 368 V448" class="arrow"/>
<path d="M960 368 V448" class="arrow"/>
<text x="620" y="411" class="small" text-anchor="start">One possible placement</text>
<!-- Two resident workgroups per SM -->
<rect x="80" y="466" width="320" height="236" rx="14" fill="#f6f9fb" stroke="#d1dfeb" stroke-width="1.8"/>
<text x="104" y="508" class="section" text-anchor="start">SM 0</text>
<rect x="104" y="534" width="272" height="60" rx="14" fill="#fff" stroke="#d1dfeb" stroke-width="1.8"/>
<text x="240" y="572" class="label" text-anchor="middle">WG (0, 0, 0)</text>
<rect x="104" y="610" width="272" height="60" rx="14" fill="#fff" stroke="#d1dfeb" stroke-width="1.8"/>
<text x="240" y="648" class="label" text-anchor="middle">WG (0, 1, 0)</text>
<rect x="440" y="466" width="320" height="236" rx="14" fill="#f6f9fb" stroke="#d1dfeb" stroke-width="1.8"/>
<text x="464" y="508" class="section" text-anchor="start">SM 1</text>
<rect x="464" y="534" width="272" height="60" rx="14" fill="#fff" stroke="#d1dfeb" stroke-width="1.8"/>
<text x="600" y="572" class="label" text-anchor="middle">WG (1, 0, 0)</text>
<rect x="464" y="610" width="272" height="60" rx="14" fill="#fff" stroke="#d1dfeb" stroke-width="1.8"/>
<text x="600" y="648" class="label" text-anchor="middle">WG (1, 1, 0)</text>
<rect x="800" y="466" width="320" height="236" rx="14" fill="#f6f9fb" stroke="#d1dfeb" stroke-width="1.8"/>
<text x="824" y="508" class="section" text-anchor="start">SM 2</text>
<rect x="824" y="534" width="272" height="60" rx="14" fill="#fff" stroke="#d1dfeb" stroke-width="1.8"/>
<text x="960" y="572" class="label" text-anchor="middle">WG (2, 0, 0)</text>
<rect x="824" y="610" width="272" height="60" rx="14" fill="#fff" stroke="#d1dfeb" stroke-width="1.8"/>
<text x="960" y="648" class="label" text-anchor="middle">WG (2, 1, 0)</text>
<text x="80" y="751" class="label" text-anchor="start">Each workgroup stays together. Each SM can hold several workgroups.</text>
<text x="80" y="783" class="small" text-anchor="start">The grid does not prescribe physical placement or execution order.</text>
</svg>
