<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Four warps share one workgroup memory allocation</title><desc id="desc">A 128-thread workgroup contains four NVIDIA-style warps, each with 32 threads. Dashed access lines connect all four warps to one shared-memory allocation accessible by all 128 threads. The diagram shows access scope, not execution order.</desc>
<defs>
<marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,7 L7,3.5 z" fill="#516559"/></marker>
<style>
text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243028; }
.section { font-size: 24px; font-weight: 700; }
.label { font-size: 21px; font-weight: 680; }
.small { font-size: 19px; fill: #586c5d; }
.math { font-family: Georgia, "Times New Roman", serif; font-size: 24px; font-weight: 650; }
.arrow { fill: none; stroke: #516559; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
</style></defs>
<rect width="1200" height="650" rx="24" fill="#fbfdf8"/>
<!-- One workgroup contains four warps and one shared allocation -->
<rect x="48" y="48" width="1104" height="554" rx="22" fill="#f6f9fb" stroke="#8fa499" stroke-width="1.8"/>
<text x="80" y="100" class="section" text-anchor="start">Workgroup (128 threads)</text>
<rect x="80" y="154" width="248" height="144" rx="16" fill="#eaf3fb" stroke="#8fb3d2" stroke-width="1.8"/>
<text x="204" y="211" class="section" text-anchor="middle">Warp 0</text>
<text x="204" y="255" class="label" text-anchor="middle">32 threads</text>
<path d="M204 314 V426" fill="none" stroke="#63766a" stroke-width="2.2" stroke-dasharray="9 7"/>
<rect x="344" y="154" width="248" height="144" rx="16" fill="#eaf3fb" stroke="#8fb3d2" stroke-width="1.8"/>
<text x="468" y="211" class="section" text-anchor="middle">Warp 1</text>
<text x="468" y="255" class="label" text-anchor="middle">32 threads</text>
<path d="M468 314 V426" fill="none" stroke="#63766a" stroke-width="2.2" stroke-dasharray="9 7"/>
<rect x="608" y="154" width="248" height="144" rx="16" fill="#eaf3fb" stroke="#8fb3d2" stroke-width="1.8"/>
<text x="732" y="211" class="section" text-anchor="middle">Warp 2</text>
<text x="732" y="255" class="label" text-anchor="middle">32 threads</text>
<path d="M732 314 V426" fill="none" stroke="#63766a" stroke-width="2.2" stroke-dasharray="9 7"/>
<rect x="872" y="154" width="248" height="144" rx="16" fill="#eaf3fb" stroke="#8fb3d2" stroke-width="1.8"/>
<text x="996" y="211" class="section" text-anchor="middle">Warp 3</text>
<text x="996" y="255" class="label" text-anchor="middle">32 threads</text>
<path d="M996 314 V426" fill="none" stroke="#63766a" stroke-width="2.2" stroke-dasharray="9 7"/>
<rect x="80" y="442" width="1040" height="120" rx="18" fill="#fff4e3" stroke="#d99c48" stroke-width="2"/>
<text x="600" y="489" class="section" text-anchor="middle">Shared Memory</text>
<text x="600" y="532" class="label" text-anchor="middle">Accessible by all 128 threads</text>
</svg>
