<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1520" role="img" aria-labelledby="title desc">
<title id="title">A workgroup divided into warps, and one warp executing on per-thread data</title><desc id="desc">A 256-thread workgroup has eight NVIDIA warps of 32 threads. Warp zero is expanded to show all 32 lanes, each representing one thread. A final panel shows one common addition instruction applied to separate values in four illustrative lanes. The eight by four lane arrangement is for display, not physical placement or Vulkan local indexing.</desc>
<defs>
<marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,7 L7,3.5 z" fill="#516559"/></marker>
<style>
text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243028; }
.section { font-size: 24px; font-weight: 700; }
.label { font-size: 21px; font-weight: 680; }
.small { font-size: 19px; fill: #586c5d; }
.math { font-family: Georgia, "Times New Roman", serif; font-size: 24px; font-weight: 650; }
.arrow { fill: none; stroke: #516559; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
</style></defs>
<rect width="1200" height="1520" rx="24" fill="#fbfdf8"/>
