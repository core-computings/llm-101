<text x="602" y="244" class="label" text-anchor="middle">Waiting for load result</text>
<text x="602" y="278" class="small" text-anchor="middle">Still resident</text>
<!-- Actual issue choices for this conceptual scheduler -->
<rect x="48" y="534" width="1104" height="198" rx="14" fill="#f6f9fb" stroke="#d1dfeb" stroke-width="1.8"/>
<text x="80" y="578" class="section" text-anchor="start">Scheduler issue trace</text>
<rect x="240" y="610" width="132" height="76" rx="14" fill="#fff4e3" stroke="#d99c48" stroke-width="1.8"/>
<text x="306" y="656" class="label" text-anchor="middle">A: load</text>
<rect x="388" y="610" width="132" height="76" rx="14" fill="#edf7e6" stroke="#9dbb88" stroke-width="1.8"/>
<text x="454" y="656" class="label" text-anchor="middle">B: math</text>
<rect x="536" y="610" width="132" height="76" rx="14" fill="#edf7e6" stroke="#9dbb88" stroke-width="1.8"/>
<text x="602" y="656" class="label" text-anchor="middle">B: math</text>
<rect x="684" y="610" width="132" height="76" rx="14" fill="#edf7e6" stroke="#9dbb88" stroke-width="1.8"/>
<text x="750" y="656" class="label" text-anchor="middle">B: math</text>
<rect x="832" y="610" width="132" height="76" rx="14" fill="#edf7e6" stroke="#9dbb88" stroke-width="1.8"/>
<text x="898" y="656" class="label" text-anchor="middle">A: math</text>
<rect x="980" y="610" width="132" height="76" rx="14" fill="#edf7e6" stroke="#9dbb88" stroke-width="1.8"/>
<text x="1046" y="656" class="label" text-anchor="middle">A: math</text>
<text x="48" y="783" class="label" text-anchor="start">B supplies work while A waits. Both warps keep their allocated state.</text>
<text x="48" y="815" class="small" text-anchor="start">Schematic issue opportunities, not measured cycles or a guaranteed scheduling order.</text>
</svg>
