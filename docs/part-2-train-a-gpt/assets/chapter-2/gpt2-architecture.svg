<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 2550" role="img" aria-labelledby="title desc">
  <title id="title">GPT-2 small architecture with residual skip connections</title>
  <desc id="desc">A vertical diagram of GPT-2 small. It shows token and position embeddings, an expanded first Transformer block, omitted middle blocks, an expanded final block, and the language-model head. Each block uses skip connections around causal self-attention and the feed-forward network.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" markerWidth="6" markerHeight="6" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#607080"/>
    </marker>
    <marker id="arrow-small" viewBox="0 0 8 8" markerWidth="4.5" markerHeight="4.5" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8291a0"/>
    </marker>
    <style>
      .title { font: 700 30px system-ui, -apple-system, sans-serif; fill: #22303d; }
      .section { font: 700 20px system-ui, -apple-system, sans-serif; fill: #22303d; }
      .node { font: 650 17px system-ui, -apple-system, sans-serif; fill: #22303d; }
      .shape { font: 500 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #445363; }
      .small { font: 500 14px system-ui, -apple-system, sans-serif; fill: #526273; }
      .card { fill: #ffffff; stroke: #9fb0bf; stroke-width: 2; }
      .input { fill: #eaf4ff; stroke: #9fc2e7; stroke-width: 2; }
      .embedding { fill: #fff1df; stroke: #e8bd83; stroke-width: 2; }
      .ln { fill: #f3faeb; stroke: #b6d492; stroke-width: 1.5; }
      .attention { fill: #eaf4ff; stroke: #9fc2e7; stroke-width: 1.5; }
      .mlp { fill: #fff1df; stroke: #e8bd83; stroke-width: 1.5; }
      .residual { fill: #f4f6f8; stroke: #c4cdd5; stroke-width: 1.5; }
      .output { fill: #f3faeb; stroke: #b6d492; stroke-width: 2; }
      .flow { stroke: #607080; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .internal-flow { stroke: #8291a0; stroke-width: 1.5; fill: none; marker-end: url(#arrow-small); }
      .skip-flow { stroke: #627b91; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .plus { fill: #ffffff; stroke: #627b91; stroke-width: 2.5; }
      .plus-text { font: 700 30px system-ui, -apple-system, sans-serif; fill: #395367; }
    </style>

    <g id="transformer-block">
      <rect class="card" x="70" y="0" width="860" height="800" rx="18"/>

      <line class="internal-flow" x1="500" y1="0" x2="500" y2="52"/>
      <rect class="residual" x="360" y="58" width="280" height="50" rx="10"/>
      <text class="node" x="500" y="80" text-anchor="middle">Residual stream x</text>
      <text class="shape" x="500" y="99" text-anchor="middle">[B, T, 768]</text>
      <line class="internal-flow" x1="500" y1="108" x2="500" y2="139"/>
      <rect class="ln" x="330" y="145" width="340" height="48" rx="10"/>
      <text class="node" x="500" y="175" text-anchor="middle">LayerNorm · <tspan class="shape">[B, T, 768]</tspan></text>
      <line class="internal-flow" x1="500" y1="193" x2="500" y2="224"/>
      <rect class="attention" x="270" y="230" width="460" height="60" rx="10"/>
      <text class="node" x="500" y="254" text-anchor="middle">Causal self-attention</text>
      <text class="shape" x="500" y="276" text-anchor="middle">Q,K,V [B, 12, T, 64] → [B, T, 768]</text>
      <line class="internal-flow" x1="500" y1="290" x2="500" y2="310"/>

      <path class="skip-flow" d="M360 83 H175 V345 H462"/>
      <text class="small" x="160" y="240" text-anchor="end">skip</text>
      <circle class="plus" cx="500" cy="345" r="28"/>
      <text class="plus-text" x="500" y="355" text-anchor="middle">+</text>
      <line class="internal-flow" x1="500" y1="373" x2="500" y2="394"/>
      <rect class="residual" x="260" y="400" width="480" height="52" rx="10"/>
      <text class="node" x="500" y="422" text-anchor="middle">Residual add: x + Attention(LN(x))</text>
      <text class="shape" x="500" y="441" text-anchor="middle">[B, T, 768]</text>

      <line class="internal-flow" x1="500" y1="452" x2="500" y2="479"/>
      <rect class="ln" x="330" y="485" width="340" height="48" rx="10"/>
      <text class="node" x="500" y="515" text-anchor="middle">LayerNorm · <tspan class="shape">[B, T, 768]</tspan></text>
      <line class="internal-flow" x1="500" y1="533" x2="500" y2="564"/>
      <rect class="mlp" x="245" y="570" width="510" height="60" rx="10"/>
      <text class="node" x="500" y="594" text-anchor="middle">Feed-forward MLP</text>
      <text class="shape" x="500" y="616" text-anchor="middle">[B, T, 768] → [B, T, 3072] → [B, T, 768]</text>
      <line class="internal-flow" x1="500" y1="630" x2="500" y2="645"/>

      <path class="skip-flow" d="M260 426 H175 V680 H462"/>
      <text class="small" x="160" y="585" text-anchor="end">skip</text>
      <circle class="plus" cx="500" cy="680" r="28"/>
      <text class="plus-text" x="500" y="690" text-anchor="middle">+</text>
      <line class="internal-flow" x1="500" y1="708" x2="500" y2="729"/>
      <rect class="residual" x="190" y="735" width="620" height="52" rx="10"/>
      <text class="node" x="500" y="757" text-anchor="middle">Residual add: h + MLP(LN(h))</text>
      <text class="shape" x="500" y="776" text-anchor="middle">[B, T, 768]</text>
    </g>
  </defs>

  <rect width="1000" height="2550" fill="#ffffff"/>
  <text class="title" x="500" y="40" text-anchor="middle">GPT-2 small · residual Transformer stack</text>
  <text class="small" x="500" y="65" text-anchor="middle">B = batch size · T ≤ 1024 = sequence length · hidden size = 768</text>

  <rect class="input" x="90" y="90" width="300" height="55" rx="12"/>
  <rect class="input" x="610" y="90" width="300" height="55" rx="12"/>
  <text class="node" x="240" y="114" text-anchor="middle">Token IDs</text>
  <text class="shape" x="240" y="135" text-anchor="middle">[B, T]</text>
  <text class="node" x="760" y="114" text-anchor="middle">Position IDs</text>
  <text class="shape" x="760" y="135" text-anchor="middle">[B, T]</text>
  <path class="flow" d="M240 145 V158"/>
  <path class="flow" d="M760 145 V158"/>

  <rect class="embedding" x="60" y="165" width="360" height="65" rx="12"/>
  <rect class="embedding" x="580" y="165" width="360" height="65" rx="12"/>
  <text class="node" x="240" y="191" text-anchor="middle">Token embedding · wte</text>
  <text class="shape" x="240" y="214" text-anchor="middle">[50257, 768]</text>
  <text class="node" x="760" y="191" text-anchor="middle">Position embedding · wpe</text>
  <text class="shape" x="760" y="214" text-anchor="middle">[1024, 768]</text>
  <path class="flow" d="M240 230 V250 H425 V262"/>
  <path class="flow" d="M760 230 V250 H575 V262"/>

  <rect class="output" x="310" y="270" width="380" height="62" rx="12"/>
  <text class="node" x="500" y="296" text-anchor="middle">Embedding sum</text>
  <text class="shape" x="500" y="318" text-anchor="middle">[B, T, 768]</text>
  <path class="flow" d="M500 332 V384"/>

  <g transform="translate(0,390)">
    <use href="#transformer-block"/>
    <text class="section" x="105" y="33">Block 1 / 12</text>
  </g>

  <path class="flow" d="M500 1190 V1235"/>
  <text class="title" x="500" y="1283" text-anchor="middle">⋮</text>
  <text class="small" x="500" y="1315" text-anchor="middle">Blocks 2–11 (same structure)</text>
  <path class="flow" d="M500 1335 V1364"/>

  <g transform="translate(0,1370)">
    <use href="#transformer-block"/>
    <text class="section" x="105" y="33">Block 12 / 12</text>
  </g>

  <path class="flow" d="M500 2170 V2225"/>
  <rect class="output" x="210" y="2235" width="580" height="58" rx="12"/>
  <text class="node" x="500" y="2260" text-anchor="middle">Final LayerNorm</text>
  <text class="shape" x="500" y="2280" text-anchor="middle">[B, T, 768]</text>
  <path class="flow" d="M500 2293 V2335"/>
  <rect class="output" x="190" y="2345" width="620" height="68" rx="12"/>
  <text class="node" x="500" y="2373" text-anchor="middle">Language-model head · lm_head</text>
  <text class="shape" x="500" y="2397" text-anchor="middle">[B, T, 768] → [B, T, 50257]</text>
  <text class="small" x="500" y="2455" text-anchor="middle">One logit for every vocabulary token at every sequence position</text>
</svg>
