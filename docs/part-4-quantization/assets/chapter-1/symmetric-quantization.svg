<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Symmetric quantization mirrors the positive and negative ranges around zero</title>
  <desc id="desc">The observed data spans -0.8 to 1.6. The largest absolute value, 1.6, defines the symmetric quantization range -1.6 to 1.6 with scale 1.6/127. A dashed segment and hollow endpoint show the extension to -1.6, which is not an observed sample. Actual samples -0.8, 0, 0.8, and 1.6 map to -64, 0, 64, and 127. A dashed arrow connects the extended boundary -1.6 to -127. Both sides of the INT8 range have 127 steps from zero. Both axes use proportional spacing.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,8 L8,4 z" fill="#516559"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243028; }
      .label { font-size: 26px; font-weight: 680; }
      .small { font-size: 22px; fill: #586c5d; }
      .number { font-size: 26px; text-anchor: middle; }
      .blue { fill: #cde2f3; stroke: #4e789f; stroke-width: 3; }
      .green { fill: #d8edc8; stroke: #557f40; stroke-width: 3; }
      .boundary { fill: #fcfdf9; stroke: #7d8c83; stroke-width: 2.2; }
      .dashed { stroke-dasharray: 7 7; }
      .axis { fill: none; stroke-width: 2.2; stroke-linecap: round; }
      .connector { fill: none; stroke: #516559; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="618" rx="24" fill="#fcfdf9" stroke="#dbe3df" stroke-width="1.5"/>

  <!-- Asymmetric observed data, extended to a symmetric quantization range -->
  <text x="56" y="70" class="label">Floating-point</text>
  <path d="M160 160 H400" class="axis dashed" stroke="#7d8c83"/>
  <path d="M400 160 H1120" class="axis" stroke="#4e789f"/>
  <text x="400" y="92" class="small" text-anchor="middle">min</text>
  <text x="1120" y="92" class="small" text-anchor="middle">max</text>
  <text x="280" y="210" class="small" text-anchor="middle">extended</text>
  <circle cx="160" cy="160" r="8" class="boundary"/>
  <circle cx="400" cy="160" r="8" class="blue"/>
  <circle cx="640" cy="160" r="8" class="blue"/>
  <circle cx="880" cy="160" r="8" class="blue"/>
  <circle cx="1120" cy="160" r="8" class="blue"/>
  <text x="160" y="124" class="number">−1.6</text>
  <text x="400" y="124" class="number">−0.8</text>
  <text x="640" y="124" class="number">0</text>
  <text x="880" y="124" class="number">+0.8</text>
  <text x="1120" y="124" class="number">+1.6</text>

  <!-- Solid arrows map actual samples, the dashed arrow maps the extended boundary -->
  <path d="M160 184 L360 356" class="connector dashed arrow"/>
  <path d="M400 184 L498.898 356" class="connector arrow"/>
  <path d="M640 184 V356" class="connector arrow"/>
  <path d="M880 184 L781.102 356" class="connector arrow"/>
  <path d="M1120 184 L920 356" class="connector arrow"/>
  <text x="668" y="282" class="small">z = 0</text>

  <!-- Symmetric INT8 range, -128 intentionally unused -->
  <text x="264" y="388" class="label">INT8</text>
  <path d="M360 380 H920" class="axis" stroke="#557f40"/>
  <path d="M360 370 V390 M428.346 374 V386 M498.898 370 V390 M569.449 374 V386 M640 370 V390 M710.551 374 V386 M781.102 370 V390 M851.654 374 V386 M920 370 V390" class="axis" stroke="#557f40"/>
  <circle cx="360" cy="380" r="8" class="boundary"/>
  <circle cx="498.898" cy="380" r="8" class="green"/>
  <circle cx="640" cy="380" r="8" class="green"/>
  <circle cx="781.102" cy="380" r="8" class="green"/>
  <circle cx="920" cy="380" r="8" class="green"/>
  <text x="360" y="426" class="number">−127</text>
  <text x="498.898" y="426" class="number">−64</text>
  <text x="640" y="426" class="number">0</text>
  <text x="781.102" y="426" class="number">+64</text>
  <text x="920" y="426" class="number">+127</text>

  <!-- Equal distances from the central zero -->
  <path d="M360 470 V482 H920 V470 M640 470 V482" class="connector"/>
  <text x="500" y="520" class="small" text-anchor="middle">127 steps</text>
  <text x="780" y="520" class="small" text-anchor="middle">127 steps</text>
  <text x="56" y="578" class="small">Same scale on both sides: 1.6/127</text>
</svg>
